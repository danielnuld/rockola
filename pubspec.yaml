name: rockola
description: "Reproductor de música para Jellyfin: iPhone, web y terminal."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  audio_service: ^0.18.19
  connectivity_plus: ^7.3.1
  flutter:
    sdk: flutter
  http: ^1.6.0
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Empaquetadas y no por google_fonts: la app se tiene que ver igual sin conexion.
  # Instancias estaticas, licencia OFL al lado.
  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700

# Rockola para Windows: la app de escritorio empaquetada en un instalador, RockolaSetup.exe.
# A mano; si ya existe la release v<version>, sube ahi el instalador.
name: Windows
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versión (sin la v), p. ej. 0.2.0
        required: true

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          cache: true
      - run: flutter build windows --release
      # El runtime de Visual C++ junto al .exe: asi arranca aunque el equipo no lo tenga.
      - shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build\windows\x64\runner\Release\
          }
      - shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=${{ inputs.version }}" windows\instalador.iss
      - uses: actions/upload-artifact@v4
        with:
          name: RockolaSetup
          path: build/instalador/RockolaSetup.exe
          retention-days: 7
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ inputs.version }}" *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload "v${{ inputs.version }}" build/instalador/RockolaSetup.exe --clobber }
          else { "Sin release v${{ inputs.version }}: el instalador queda como artefacto." }

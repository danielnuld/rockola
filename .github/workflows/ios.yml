# IPA sin firmar para instalar con Sideloadly (Apple ID gratis, caduca a los 7 dias).
# Solo a mano: en un repo privado cada minuto de macOS cuenta por diez.
name: iOS
on: workflow_dispatch

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          cache: true
      - run: flutter build ios --release --no-codesign
      - run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry rockola.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: rockola-ipa
          path: rockola.ipa
          retention-days: 7
